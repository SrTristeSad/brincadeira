name: MakeHumano - motor wgpu experimental

on:
  push:
    paths:
      - "makehumano/motor_wgpu/**"
      - "makehumano/testes/test_motor_wgpu.py"
      - ".github/workflows/testar-wgpu.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: makehumano/motor_wgpu/requirements.txt
      - name: Instalar NumPy
        run: python -m pip install "numpy>=2,<3"
      - name: Validar malhas, UV e materiais
        run: python -m unittest discover -s makehumano/testes -p test_motor_wgpu.py -v

  vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: makehumano/motor_wgpu/requirements.txt
      - name: Instalar ambiente gráfico Qt e Vulkan (software)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libvulkan1 mesa-vulkan-drivers \
            libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 \
            libxcb-keysyms1 libxcb-icccm4 libxcb-image0 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinput0 \
            libxcb-util1 libxcb-shape0 libxcb-xfixes0 \
            libxcb-sync1 libx11-xcb1 libfontconfig1 libglu1-mesa
      - name: Instalar wgpu, rendercanvas e PyQt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r makehumano/motor_wgpu/requirements.txt
      - name: Conferir adaptadores wgpu disponíveis
        run: |
          python -c "import wgpu; print([a.summary for a in wgpu.gpu.enumerate_adapters_sync()])"
      - name: Abrir a janela e desenhar pelo Vulkan com Lavapipe
        working-directory: makehumano
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_X11_NO_MITSHM: "1"
          WGPU_BACKEND_TYPE: Vulkan
        run: xvfb-run -a -s "-screen 0 1280x800x24" python -u -m motor_wgpu.app --backend vulkan --smoke
