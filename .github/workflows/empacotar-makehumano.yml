name: MakeHumano - ZIP portátil de testes

on:
  push:
    paths:
      - ".github/workflows/empacotar-makehumano.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portatil:
    name: ZIP portátil ${{ matrix.nome }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            nome: Windows
          - os: ubuntu-24.04
            nome: Linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: makehumano/motor_wgpu/requirements.txt

      - name: Instalar bibliotecas e empacotador
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r makehumano/codigo/requirements.txt "pyinstaller>=6.10,<7"

      - name: Construir executável com dependências incluídas
        shell: bash
        run: |
          # O entrypoint original carrega mhmain dinamicamente após
          # set_sys_path(); sem --paths/hidden-import o PyInstaller só
          # analisa a tela de licença e omite cProfile e dependências.
          python -m PyInstaller --noconfirm --clean --onedir --console \
            --name MakeHumano \
            --paths makehumano/codigo/makehuman/lib \
            --paths makehumano/codigo/makehuman/core \
            --paths makehumano/codigo/makehuman/shared \
            --paths makehumano/codigo/makehuman/apps \
            --paths makehumano/codigo/makehuman/apps/gui \
            --hidden-import mhmain \
            --hidden-import cProfile \
            --collect-all PyQt5 \
            --collect-all numpy \
            --collect-all wgpu \
            --collect-all rendercanvas \
            --hidden-import PyQt5.QtWidgets \
            --hidden-import PyQt5.QtCore \
            --hidden-import PyQt5.QtGui \
            --hidden-import PyQt5.QtSvg \
            --hidden-import wgpu.backends.wgpu_native \
            --hidden-import rendercanvas.qt \
            makehumano/codigo/makehuman/makehuman.py

      - name: Copiar recursos originais, plugins, targets e modelos
        shell: bash
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          origem = Path("makehumano/codigo/makehuman")
          destino = Path("dist/MakeHumano")
          assert (destino / ("MakeHumano.exe" if os.name == "nt" else "MakeHumano")).exists()
          for item in origem.iterdir():
              if item.name in {"__pycache__", ".git"}:
                  continue
              alvo = destino / item.name
              if item.is_dir():
                  shutil.copytree(item, alvo, dirs_exist_ok=True,
                                  ignore=shutil.ignore_patterns("__pycache__", "*.pyc"))
              elif item.is_file():
                  shutil.copy2(item, alvo)
          exigidos = ("data", "plugins", "lib", "apps", "shared", "core")
          for nome in exigidos:
              assert (destino / nome).is_dir(), f"Recurso obrigatório ausente: {nome}"
          print("Recursos copiados:", ", ".join(exigidos))
          PY

      - name: Criar iniciadores e instruções
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          pasta = Path("dist/MakeHumano")
          (pasta / "LEIA-ME.txt").write_text(
              "MAKEHUMANO - TESTE VULKAN (NAO E VERSAO FINAL)\n\n"
              "WINDOWS: clique duas vezes em Iniciar-MakeHumano.bat.\n"
              "LINUX: execute ./Iniciar-MakeHumano.sh em um terminal.\n\n"
              "O Python e as bibliotecas Python estao inclusos no pacote.\n"
              "Ainda e necessario ter drivers de video com Vulkan.\n"
              "Alguns plugins, shaders e funcoes de edicao podem apresentar falhas.\n"
              "Codigo original baseado no MakeHuman (AGPLv3).\n",
              encoding="utf-8",
          )
          (pasta / "Iniciar-MakeHumano.bat").write_text(
              '@echo off\r\ncd /d "%~dp0"\r\n'
              'set WGPU_BACKEND_TYPE=Vulkan\r\n'
              'set "MAKEHUMANO_PORTABLE_ERROR_LOG=%~dp0MakeHumano-erro.txt"\r\n'
              '"%~dp0MakeHumano.exe" %*\r\n'
              'if errorlevel 1 (\r\n'
              'echo.\r\n'
              'echo Erro ao abrir MakeHumano.\r\n'
              'if exist "%~dp0MakeHumano-erro.txt" type "%~dp0MakeHumano-erro.txt"\r\n'
              'echo Envie o arquivo MakeHumano-erro.txt ao relatar o problema.\r\n'
              'pause\r\n'
              ')\r\n',
              encoding="utf-8",
          )
          script = pasta / "Iniciar-MakeHumano.sh"
          script.write_text(
              '#!/usr/bin/env sh\n'
              'cd "$(dirname "$0")" || exit 1\n'
              'export WGPU_BACKEND_TYPE=Vulkan\n'
              'exec ./MakeHumano "$@"\n',
              encoding="utf-8",
          )
          script.chmod(0o755)
          PY

      - name: Testar importações reais da GUI portátil no Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pasta = (Resolve-Path "dist/MakeHumano").Path
          $env:MAKEHUMANO_PORTABLE_SELFTEST = "1"
          $env:MAKEHUMANO_PORTABLE_SELFTEST_FILE = Join-Path $pasta "autoteste.ok"
          $env:MAKEHUMANO_PORTABLE_ERROR_LOG = Join-Path $pasta "MakeHumano-erro.txt"
          $exe = Join-Path $pasta "MakeHumano.exe"
          $processo = Start-Process -FilePath $exe -WorkingDirectory $pasta -Wait -PassThru
          if ($processo.ExitCode -ne 0) {
            if (Test-Path $env:MAKEHUMANO_PORTABLE_ERROR_LOG) {
              Get-Content $env:MAKEHUMANO_PORTABLE_ERROR_LOG
            }
            throw "GUI portátil não conseguiu importar mhmain: $($processo.ExitCode)"
          }
          if (!(Test-Path $env:MAKEHUMANO_PORTABLE_SELFTEST_FILE)) {
            throw "A GUI portátil não chegou ao import de mhmain"
          }
          if ((Get-Content $env:MAKEHUMANO_PORTABLE_SELFTEST_FILE -Raw).Trim() -ne "imports-ok") {
            throw "Autoteste portátil inválido"
          }
          Remove-Item $env:MAKEHUMANO_PORTABLE_SELFTEST_FILE
          Remove-Item $env:MAKEHUMANO_PORTABLE_ERROR_LOG -ErrorAction SilentlyContinue
          Write-Output "As importações reais da GUI portátil passaram."

      - name: Testar importações reais da GUI portátil no Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd dist/MakeHumano
          export MAKEHUMANO_PORTABLE_SELFTEST=1
          export MAKEHUMANO_PORTABLE_SELFTEST_FILE="$(pwd)/autoteste.ok"
          export MAKEHUMANO_PORTABLE_ERROR_LOG="$(pwd)/MakeHumano-erro.txt"
          timeout 60 ./MakeHumano
          test "$(cat autoteste.ok)" = "imports-ok"
          rm -f autoteste.ok MakeHumano-erro.txt
          test -x ./Iniciar-MakeHumano.sh

      - name: Verificar abertura da GUI congelada no Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libvulkan1 mesa-vulkan-drivers libglu1-mesa \
            libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 \
            libxcb-keysyms1 libxcb-icccm4 libxcb-image0 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinput0 \
            libxcb-util1 libxcb-shape0 libxcb-xfixes0 \
            libxcb-sync1 libx11-xcb1 libfontconfig1
          cd dist/MakeHumano
          export WGPU_BACKEND_TYPE=Vulkan
          export LIBGL_ALWAYS_SOFTWARE=1
          export QT_X11_NO_MITSHM=1
          export MAKEHUMANO_SMOKE_READY_FILE="$(pwd)/gui-congelada.ok"
          export HOME="$(mktemp -d)"
          xvfb-run -a -s "-screen 0 1280x800x24" ./MakeHumano > teste-gui.log 2>&1 &
          processo=$!
          trap 'kill "$processo" 2>/dev/null || true' EXIT
          for tentativa in $(seq 1 55); do
            if test -f gui-congelada.ok; then break; fi
            if ! kill -0 "$processo" 2>/dev/null; then
              echo "Executável portátil encerrou antes de abrir a GUI:"
              tail -100 teste-gui.log
              exit 1
            fi
            sleep 1
          done
          if ! test -f gui-congelada.ok; then
            echo "GUI congelada não sinalizou abertura:"
            tail -100 teste-gui.log
            exit 1
          fi
          kill "$processo" 2>/dev/null || true
          wait "$processo" || true
          rm -f gui-congelada.ok teste-gui.log
          echo "GUI portátil Linux abriu em Vulkan com recursos originais."

      - name: Disponibilizar o ZIP portátil
        uses: actions/upload-artifact@v4
        with:
          name: MakeHumano-${{ matrix.nome }}-Vulkan-portatil
          path: dist/MakeHumano/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
