name: Verificar Python e deformações 3D

on:
  push:
    paths:
      - "makehumano/**"
      - ".github/workflows/testar-makehumano.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: makehumano/codigo/requirements.txt

      - name: Instalar dependências originais
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r makehumano/codigo/requirements.txt

      - name: Importar bibliotecas essenciais
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import numpy; import OpenGL.GL; from PyQt5 import QtCore, QtWidgets; print('NumPy, PyOpenGL e PyQt5: importações OK')"

      - name: Conferir sintaxe de todos os módulos
        run: python makehumano/diagnostico.py

      - name: Executar testes dos morph targets
        run: python -m unittest discover -s makehumano/testes -p "test_*.py" -v
